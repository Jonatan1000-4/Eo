<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TV | Canales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#101412;
  --panel:#171d1a;
  --card:#1d2521;
  --line:rgba(214,235,219,.12);
  --text:#f2f7f1;
  --muted:#9ba99d;
  --accent:#c7f36b;
  --accent-soft:rgba(199,243,107,.12);
  --radius:18px;
  --focus:#c7f36b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"DM Sans",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  background-image:radial-gradient(circle at 12% 0%,rgba(199,243,107,.1),transparent 32%),linear-gradient(135deg,#101412 0%,#111816 55%,#0d100f 100%);
}

/* TOP BAR */
.topbar{
  position:sticky;
  top:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px max(16px,calc((100vw - 1180px)/2));
  background:rgba(16,20,18,.88);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
  z-index:20;
}
.selectCat,.search{
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#202a25;
  color:var(--text);
  font-weight:600;
  outline:none;
}
.selectCat:focus,.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search{
  margin-left:auto;
  width:min(260px,34vw);
}

/* GRID */
.wrap{width:min(1180px,100%);margin:0 auto;padding:24px 16px 60px;}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;
}
.card{
  position:relative;
  min-height:174px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  cursor:pointer;
  transition:transform .2s,border-color .2s,background .2s,box-shadow .2s;
  outline:none;
}
.card:hover,.card:focus{transform:translateY(-4px);border-color:rgba(199,243,107,.55);box-shadow:0 16px 32px rgba(0,0,0,.24);background:linear-gradient(145deg,rgba(199,243,107,.12),rgba(255,255,255,.025)),var(--card)}
.card:focus{
  box-shadow:0 0 0 3px var(--accent-soft),0 16px 32px rgba(0,0,0,.24);
}
.logo{
  height:92px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:16px;
  border-radius:10px;
  border:1px solid var(--line);
  background:radial-gradient(circle at 50% 20%,rgba(199,243,107,.12),transparent 58%),#121815;
  color:var(--accent);
  font-family:"Space Grotesk",sans-serif;
  font-size:28px;
  font-weight:700;
}
.logo img{
  max-height:68px;
  max-width:82%;
  object-fit:contain;
}
.name{
  font-weight:700;
  font-size:13px;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.group{
  font-size:11px;
  color:var(--muted);
  margin-top:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.empty-state{
  grid-column:1/-1;
  display:grid;
  gap:6px;
  padding:48px 20px;
  text-align:center;
  border:1px dashed rgba(199,243,107,.28);
  border-radius:var(--radius);
  color:var(--muted);
}
.empty-state strong{color:var(--text);font-family:"Space Grotesk",sans-serif;font-size:18px}
.empty-state span{font-size:13px}

/* Toast */
.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:#253027;
  border:1px solid rgba(199,243,107,.3);
  color:#fff;
  padding:8px 12px;
  border-radius:10px;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}
.toast.show{opacity:1}
.player-modal{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(0,0,0,.82);
}
.player-modal.open{display:flex}
.player-box{
  width:min(900px,100%);
  background:#171717;
  color:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 18px 60px rgba(0,0,0,.4);
}
.player-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 14px;
}
.player-title{min-width:0}
.player-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-url{font-size:10px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-close{border:0;background:transparent;color:#fff;font-size:25px;cursor:pointer;line-height:1}
.player-video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.player-status{min-height:36px;padding:10px 14px;font-size:12px;color:#bbb}
.player-actions{display:flex;gap:8px;padding:0 14px 14px}
.player-actions button{border:0;border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:700}
.player-retry{background:var(--accent);color:#111}
.player-copy{background:#333;color:#fff}
@media(max-width:600px){
  .topbar{flex-wrap:wrap;padding:12px 14px}
  .selectCat,.search{width:100%;margin-left:0}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{min-height:160px;padding:10px}
  .logo{height:76px;margin-bottom:12px}
  .player-modal{padding:8px}
}
</style>
</head>

<body>

<header class="topbar">
  <select id="categorySelect" class="selectCat">
    <option value="ALL">Todas</option>
  </select>
  <input id="search" class="search" placeholder="Buscar"/>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
</main>

<section id="playerModal" class="player-modal" role="dialog" aria-modal="true" aria-labelledby="playerName">
  <div class="player-box">
    <div class="player-head">
      <div class="player-title">
        <div id="playerName" class="player-name">Canal</div>
        <div id="playerUrl" class="player-url"></div>
      </div>
      <button id="playerClose" class="player-close" type="button" aria-label="Cerrar reproductor">&times;</button>
    </div>
    <video id="playerVideo" class="player-video" controls autoplay playsinline></video>
    <div id="playerStatus" class="player-status">Preparando reproducción...</div>
    <div class="player-actions">
      <button id="playerRetry" class="player-retry" type="button">Reintentar</button>
      <button id="playerCopy" class="player-copy" type="button">Copiar URL</button>
    </div>
  </div>
</section>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKSdaRAQTN-Gen0k4WerLu1GvBLKzjZlQ",
  authDomain: "aweme-46b1e.firebaseapp.com",
  projectId: "aweme-46b1e",
  storageBucket: "aweme-46b1e.firebasestorage.app",
  messagingSenderId: "762479825387",
  appId: "1:762479825387:web:8ffb3a629c0eb9f52fc9ae"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ALLOWLIST_COLLECTION = "allowlist";

const M3U_URL = "https://jonatan1000-4.github.io/mi_app_rv22/canales.m3u";
const M3U_TEXT = "";
const JSON_FALLBACK = ""; // opcional: podés poner JSON aquí si querés

let ALL_CHANNELS = [];
let CURRENT_CATEGORY = "ALL";
let CURRENT_CHANNEL = null;
let hlsPlayer = null;
let mpegtsPlayer = null;
let bootStarted = false;

const $ = id=>document.getElementById(id);
const toast = t=>{
  const el=$("toast");
  el.textContent=t;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),1200);
};

async function isAllowlisted(uid){
  const snap = await getDoc(doc(db,ALLOWLIST_COLLECTION,uid));
  return snap.exists() && snap.data()?.enabled===true;
}

onAuthStateChanged(auth, async user=>{
  if(!user){ location.href="login.html"; return;}
  if(!(await isAllowlisted(user.uid))){
    await signOut(auth);
    location.href="login.html";
    return;
  }
  boot();
});

/* PARSER TOLERANTE */
function parseM3U(text){
  const lines=text.split(/\r?\n/);
  const out=[];
  let name="",logo="",group="",id="";
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(line.startsWith("#EXTINF")){
      name=line.split(",").slice(1).join(",").trim();
      const attrs=line.match(/(\w+(?:-\w+)*)="([^"]*)"/g)||[];
      attrs.forEach(a=>{
        const parts=a.split("=");
        const key=parts[0];
        const val=parts[1].replace(/"/g,"");
        if(key==="tvg-logo") logo=val;
        if(key==="group-title") group=val;
        if(key==="tvg-id") id=val;
      });
    } else if(line && !line.startsWith("#")){
      out.push({
        id:id||name,
        name:name||"Canal",
        logo:logo||"",
        group:group||"Otros",
        url:line
      });
      name="";logo="";group="";id="";
    }
  }
  return out;
}

async function loadChannels(){
  try{
    if(JSON_FALLBACK){
      return JSON.parse(JSON_FALLBACK);
    }
    let text=M3U_TEXT;
    if(!text){
      const res=await fetch(M3U_URL,{cache:"no-store"});
      text=await res.text();
    }
    const seenUrls = new Set();
    return parseM3U(text).filter(channel=>{
      const key=String(channel.url||"").trim();
      if(!key || seenUrls.has(key)) return false;
      seenUrls.add(key);
      return true;
    });
  }catch(e){
    console.error(e);
    return [];
  }
}

function populateCategories(){
  const select=$("categorySelect");
  select.innerHTML=`<option value="ALL">Todas</option>`;
  const groups=[...new Set(ALL_CHANNELS.map(c=>c.group))];
  groups.sort().forEach(g=>{
    const opt=document.createElement("option");
    opt.value=g;
    opt.textContent=g;
    select.appendChild(opt);
  });
}

function renderChannels(){
  const grid=$("grid");
  grid.innerHTML="";
  const search=$("search").value.toLowerCase();
  const list=ALL_CHANNELS.filter(c=>{
    const okCat=CURRENT_CATEGORY==="ALL"||c.group===CURRENT_CATEGORY;
    const okSearch=!search||c.name.toLowerCase().includes(search);
    return okCat&&okSearch;
  });
  if(!list.length){
    grid.innerHTML=`<div class="empty-state"><strong>No encontramos canales</strong><span>Prueba con otra búsqueda o categoría.</span></div>`;
    return;
  }

  list.forEach((c,index)=>{
    const card=document.createElement("div");
    card.className="card";
    card.tabIndex=0;
    card.innerHTML=`
      <div class="logo">
        ${c.logo?`<img src="${c.logo}" alt="" onerror="this.remove();this.parentElement.textContent='TV'">`:"TV"}
      </div>
      <div class="name">${c.name}</div>
      <div class="group">${c.group}</div>
    `;

    card.onclick=()=>playChannel(c,list);

    card.onkeydown=(e)=>{
      const cards=[...document.querySelectorAll(".card")];
      const i=cards.indexOf(card);
      if(e.key==="Enter") playChannel(c,list);
      if(e.key==="ArrowRight" && cards[i+1]) cards[i+1].focus();
      if(e.key==="ArrowLeft" && cards[i-1]) cards[i-1].focus();
      if(e.key==="ArrowDown" && cards[i+4]) cards[i+4].focus();
      if(e.key==="ArrowUp" && cards[i-4]) cards[i-4].focus();
    };

    grid.appendChild(card);
    if(index===0) setTimeout(()=>card.focus(),150);
  });
}

function closePlayer(){
  if(hlsPlayer){
    hlsPlayer.destroy();
    hlsPlayer=null;
  }
  if(mpegtsPlayer){
    mpegtsPlayer.destroy();
    mpegtsPlayer=null;
  }
  const video=$("playerVideo");
  video.pause();
  video.removeAttribute("src");
  video.load();
  $("playerModal").classList.remove("open");
}

async function copyChannelUrl(url){
  try{
    await navigator.clipboard.writeText(url);
    toast("URL copiada");
  }catch(e){
    window.prompt("Copia la URL con Ctrl+C",url);
  }
}

function showPlayerError(message){
  $("playerStatus").textContent=message;
  $("playerStatus").style.color="#ff9b9b";
}

function startBrowserPlayer(channel){
  CURRENT_CHANNEL=channel;
  $("playerName").textContent=channel.name||"Canal";
  $("playerUrl").textContent=channel.url;
  $("playerStatus").textContent="Conectando...";
  $("playerStatus").style.color="#bbb";
  $("playerModal").classList.add("open");

  if(hlsPlayer){
    hlsPlayer.destroy();
    hlsPlayer=null;
  }
  if(mpegtsPlayer){
    mpegtsPlayer.destroy();
    mpegtsPlayer=null;
  }
  const video=$("playerVideo");
  video.pause();
  video.removeAttribute("src");
  video.load();
  const url=String(channel.url||"").trim();
  const isHls=/\.m3u8(?:$|[?#])/i.test(url);
  const isMpegTs=/\.(ts|flv)(?:$|[?#])/i.test(url)||/:\d{2,5}(?:\/|$)/.test(url);
  if(isHls && window.Hls && window.Hls.isSupported()){
    hlsPlayer=new window.Hls({enableWorker:true});
    hlsPlayer.loadSource(url);
    hlsPlayer.attachMedia(video);
    hlsPlayer.on(window.Hls.Events.MANIFEST_PARSED,()=>{
      video.play().catch(()=>{});
      $("playerStatus").textContent="Reproduciendo";
    });
    hlsPlayer.on(window.Hls.Events.ERROR,(_,data)=>{
      if(data.fatal) showPlayerError(`No se pudo reproducir: ${data.details||"error del stream"}`);
    });
  }else if(isHls && video.canPlayType("application/vnd.apple.mpegurl")){
    video.src=url;
    video.play().then(()=>$("playerStatus").textContent="Reproduciendo").catch(()=>showPlayerError("El navegador bloqueó este stream HLS o el servidor no permite CORS."));
  }else if(isMpegTs && window.mpegts && window.mpegts.isSupported()){
    mpegtsPlayer=window.mpegts.createPlayer({type:url.match(/\.flv(?:$|[?#])/i)?"flv":"mpegts",isLive:true,url});
    mpegtsPlayer.attachMediaElement(video);
    mpegtsPlayer.on(window.mpegts.Events.ERROR,(_,detail)=>showPlayerError(`No se pudo reproducir MPEG-TS: ${detail||"stream no disponible"}`));
    mpegtsPlayer.load();
    mpegtsPlayer.play().then(()=>$("playerStatus").textContent="Reproduciendo").catch(()=>showPlayerError("El navegador bloqueó este stream MPEG-TS o el servidor no permite CORS."));
  }else{
    video.src=url;
    video.play().then(()=>{
      $("playerStatus").textContent="Reproduciendo";
    }).catch(()=>showPlayerError("Este formato no es compatible o el servidor bloquea la reproducción web (CORS)."));
  }
}

function playChannel(selected,list){
  const payload={
    url:selected.url,
    channels:list.map(c=>({name:c.name,url:c.url}))
  };
  startBrowserPlayer(selected);
  if(window.AndroidBridge && AndroidBridge.playChannel){
    AndroidBridge.playChannel(JSON.stringify(payload));
  }
}

async function boot(){
  if(bootStarted) return;
  bootStarted = true;
  toast("Cargando...");
  ALL_CHANNELS=await loadChannels();
  if(!ALL_CHANNELS.length){
    toast("No hay canales");
    return;
  }
  populateCategories();
  renderChannels();
  $("search").addEventListener("input",renderChannels);
  $("categorySelect").addEventListener("change",e=>{
    CURRENT_CATEGORY=e.target.value;
    renderChannels();
  });
  $("playerClose").addEventListener("click",closePlayer);
  $("playerRetry").addEventListener("click",()=>{
    if(CURRENT_CHANNEL) startBrowserPlayer(CURRENT_CHANNEL);
  });
  $("playerCopy").addEventListener("click",()=>{
    if(CURRENT_CHANNEL) copyChannelUrl(CURRENT_CHANNEL.url);
  });
  $("playerModal").addEventListener("click",e=>{
    if(e.target.id==="playerModal") closePlayer();
  });
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape" && $("playerModal").classList.contains("open")) closePlayer();
  });
  toast("Listo");
}
</script>

</body>
</html>
